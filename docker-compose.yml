version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cia-postgres
    environment:
      POSTGRES_USER: cia
      POSTGRES_PASSWORD: cia_dev_password
      POSTGRES_DB: cia
    ports:
      - "5432:5432"
    volumes:
      - cia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cia -d cia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cia-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cia_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: cia-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://cia:cia_dev_password@postgres:5432/cia
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  cia_pgdata:
  cia_redisdata:
